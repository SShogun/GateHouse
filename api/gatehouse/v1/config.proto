syntax = "proto3";
package gatehouse.v1;
option go_package = "github.com/SShogun/GateHouse/gen/go/gatehouse/v1;gatehousev1";

// GatewayConfig is a complete snapshot. List ordering participates in its hash.
message GatewayConfig {
  uint32 schema_version = 1;
  Listener listener = 2;
  repeated Route routes = 3;
  repeated Cluster clusters = 4;
}
// Listener settings are immutable within a data-plane process. Durations are nanoseconds.
message Listener {
  string address = 1;
  int64 read_header_timeout_ns = 2;
  int64 idle_timeout_ns = 3;
  int64 max_header_bytes = 4;
  int64 max_concurrent_requests = 5;
  int64 request_body_read_idle_timeout_ns = 6;
}
enum PathType {
  PATH_TYPE_UNSPECIFIED = 0;
  PATH_TYPE_EXACT = 1;
  PATH_TYPE_PREFIX = 2;
}
message Route {
  string id = 1;
  string host = 2;
  string path = 3;
  PathType path_type = 4;
  repeated string methods = 5;
  map<string, string> headers = 6;
  string cluster_id = 7;
}
enum SelectionPolicy {
  SELECTION_POLICY_UNSPECIFIED = 0;
  SELECTION_POLICY_ROUND_ROBIN = 1;
  SELECTION_POLICY_WEIGHTED_ROUND_ROBIN = 2;
}
message Cluster {
  string id = 1;
  SelectionPolicy policy = 2;
  repeated Endpoint endpoints = 3;
  uint32 healthy_threshold = 4;
  uint32 unhealthy_threshold = 5;
  HealthCheck health_check = 6;
}
message Endpoint {
  string id = 1;
  string address = 2;
  uint32 weight = 3;
  bool disabled = 4;
}
message HealthCheck {
  string path = 1;
  int64 interval_ns = 2;
  int64 timeout_ns = 3;
}
