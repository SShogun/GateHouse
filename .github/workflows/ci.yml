name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Select protobuf compatibility baseline
        env:
          PULL_REQUEST_BASE: ${{ github.event.pull_request.base.ref || '' }}
          PUSH_BEFORE: ${{ github.event.before || '' }}
        run: |
          if [ -n "$PULL_REQUEST_BASE" ]; then
            if ! git show-ref --verify --quiet "refs/remotes/origin/$PULL_REQUEST_BASE"; then
              echo "Fetched pull request base branch was not found: $PULL_REQUEST_BASE" >&2
              exit 1
            fi
            git branch "$PULL_REQUEST_BASE" "origin/$PULL_REQUEST_BASE"
            echo "BUF_BASE_BRANCH=$PULL_REQUEST_BASE" >> "$GITHUB_ENV"
          elif [ -n "$PUSH_BEFORE" ] && [ "$PUSH_BEFORE" != "0000000000000000000000000000000000000000" ]; then
            echo "BUF_BASE_REF=$PUSH_BEFORE" >> "$GITHUB_ENV"
          else
            echo "No protobuf compatibility baseline is available for this event." >&2
            exit 1
          fi
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: bufbuild/buf-setup-action@v1
        with:
          version: 1.73.0
      - run: make contracts
      - run: make compatibility-test
      - name: Check generated output drift
        run: make check-generated

  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Check Go formatting
        run: make fmt-check
      - name: Run go vet
        run: make vet
      - name: Run Staticcheck
        run: make staticcheck

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: make test

  race:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: make race

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: gatehouse_test
          POSTGRES_USER: gatehouse_test
          POSTGRES_PASSWORD: gatehouse_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gatehouse_test -d gatehouse_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      GATEHOUSE_TEST_DATABASE_URL: postgres://gatehouse_test:gatehouse_test@127.0.0.1:5432/gatehouse_test?sslmode=disable
      GATEHOUSE_TEST_DB_CONFIRM: gatehouse_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Run suite with isolated PostgreSQL integration coverage
        run: make test

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Run govulncheck
        run: make security
