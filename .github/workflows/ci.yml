name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Select protobuf compatibility baseline
        env:
          PULL_REQUEST_BASE: ${{ github.event.pull_request.base.ref || '' }}
          PUSH_BEFORE: ${{ github.event.before || '' }}
        run: |
          if [ -n "$PULL_REQUEST_BASE" ]; then
            echo "BUF_BASE_BRANCH=$PULL_REQUEST_BASE" >> "$GITHUB_ENV"
          elif [ -n "$PUSH_BEFORE" ] && [ "$PUSH_BEFORE" != "0000000000000000000000000000000000000000" ]; then
            echo "BUF_BASE_REF=$PUSH_BEFORE" >> "$GITHUB_ENV"
          else
            echo "No protobuf compatibility baseline is available for this event." >&2
            exit 1
          fi
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: bufbuild/buf-setup-action@v1
        with:
          version: 1.73.0
      - run: make contracts
      - run: make compatibility-test
      - name: Check generated output drift
        run: make check-generated

  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Check Go formatting
        run: make fmt-check
      - name: Run go vet
        run: make vet
      - name: Run Staticcheck
        run: make staticcheck

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: make test

  race:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: make race

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Run govulncheck
        run: make security
