<text x="38" y="756.76" font-family="Liberation Sans, Arial, sans-serif" font-size="18" fill="#62728c" font-weight="400">Planning targets, not a leaderboard. Shading highlights the goal row; it does not rank performance.</text>
<text x="38" y="787.76" font-family="Liberation Sans, Arial, sans-serif" font-size="18" fill="#62728c" font-weight="400">REF = eligible Caddy / Traefik: fastest sustainable capacity or lower peak RSS, at matched feature settings.</text>
<text x="38" y="818.76" font-family="Liberation Sans, Arial, sans-serif" font-size="18" fill="#62728c" font-weight="400">HTTP P0 first; HTTP/2 + gRPC after M4. Separate protocols / workloads; no unsupported feature gets a zero.</text>
<text x="38" y="849.76" font-family="Liberation Sans, Arial, sans-serif" font-size="18" fill="#62728c" font-weight="400">Report whole-stack cost including control plane + PostgreSQL (T08); lower proxy RSS is not total deployment savings.</text>
<text x="38" y="880.76" font-family="Liberation Sans, Arial, sans-serif" font-size="18" fill="#62728c" font-weight="400">All values await controlled measurement. Definitions and evidence rules: docs/Gatehouse_PRODUCT_BENCHMARKS.md.</text>
<text x="38" y="929.3" font-family="Liberation Mono, monospace" font-size="15" fill="#62728c" font-weight="400">2026-10-14 · Product hypothesis v1</text>
