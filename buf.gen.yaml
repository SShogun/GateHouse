version: v2

# Pinned Buf remote plugins make generated output reproducible. These produce
# message/service bindings for the typed control-plane API.
plugins:
  - remote: buf.build/protocolbuffers/go:v1.36.11
    out: gen/go
    opt: paths=source_relative
  - remote: buf.build/grpc/go:v1.5.1
    out: gen/go
    opt: paths=source_relative
  - remote: buf.build/bufbuild/es:v2.11.0
    out: gen/ts
